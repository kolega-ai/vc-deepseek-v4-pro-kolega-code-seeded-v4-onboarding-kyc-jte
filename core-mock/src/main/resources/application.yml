spring:
  application:
    name: core-mock

server:
  port: 8082
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  core:
    api-key: ${CORE_MOCK_KEY:dev-core-key-meridian-2026}
    token-secret: ${CORE_TOKEN_SECRET:dev-core-token-secret-meridian-2026-shared}
    token-issuer: meridian-onboarding-api
    token-audience: meridian-core-mock
