name: meridian-onboarding

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 20

  provider-mock:
    image: meridian-onboarding-provider-mock:latest
    build:
      context: .
      dockerfile: provider-mock/Dockerfile
    environment:
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-dev-provider-key-meridian-2026}
    ports:
      - "9083:8083"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c "exec 3<>/dev/tcp/localhost/8083 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep 200"
      interval: 10s
      timeout: 5s
      retries: 30

  core-mock:
    image: meridian-onboarding-core-mock:latest
    build:
      context: .
      dockerfile: core-mock/Dockerfile
    environment:
      CORE_MOCK_KEY: ${CORE_MOCK_KEY:-dev-core-key-meridian-2026}
      CORE_TOKEN_SECRET: ${CORE_TOKEN_SECRET:-dev-core-token-secret-meridian-2026-shared}
    ports:
      - "9082:8082"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c "exec 3<>/dev/tcp/localhost/8082 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep 200"
      interval: 10s
      timeout: 5s
      retries: 30

  onboarding-api:
    image: meridian-onboarding-onboarding-api:latest
    build:
      context: .
      dockerfile: onboarding-api/Dockerfile
    environment:
      ONB_DB_URL: jdbc:postgresql://postgres:5432/meridian
      ONB_DB_USER: meridian
      ONB_DB_PASSWORD: meridian
      ONB_JWT_SECRET: ${ONB_JWT_SECRET:-dev-only-change-me-meridian-onboarding-hs256-secret-2026}
      PROVIDER_MOCK_URL: http://provider-mock:8083
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-dev-provider-key-meridian-2026}
      CORE_MOCK_URL: http://core-mock:8082
      CORE_MOCK_KEY: ${CORE_MOCK_KEY:-dev-core-key-meridian-2026}
      CORE_TOKEN_SECRET: ${CORE_TOKEN_SECRET:-dev-core-token-secret-meridian-2026-shared}
      ONB_STORAGE_DIR: /app/storage
      APP_WEB_URL: http://localhost:9080
      SEED_ENABLED: "true"
    ports:
      - "9081:8081"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_healthy
      core-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep 200"
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s

  web:
    image: meridian-onboarding-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      ONB_API_URL: http://onboarding-api:8081
    ports:
      - "9080:8080"
    depends_on:
      onboarding-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep 200"
      interval: 15s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  storage:
