spring:
  application:
    name: onboarding-api
  datasource:
    url: ${ONB_DB_URL:jdbc:postgresql://localhost:5432/meridian}
    username: ${ONB_DB_USER:meridian}
    password: ${ONB_DB_PASSWORD:meridian}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null

server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  web-url: ${APP_WEB_URL:http://localhost:8080}
  jwt:
    secret: ${ONB_JWT_SECRET:dev-only-change-me-meridian-onboarding-hs256-secret-2026}
    issuer: meridian-onboarding-api
    audience: meridian-channel
    ttl: PT12H
  auth:
    otp-ttl: PT10M
    otp-issue-window: PT1H
    otp-max-issues-per-window: 5
    otp-max-verify-attempts: 5
    step-up-ttl: PT5M
    reset-token-ttl: PT30M
    max-failed-logins: 5
    login-lock-minutes: 15
  storage:
    dir: ${ONB_STORAGE_DIR:./storage/documents}
  providers:
    base-url: ${PROVIDER_MOCK_URL:http://localhost:8083}
    api-key: ${PROVIDER_API_KEY:dev-provider-key-meridian-2026}
  core-mock:
    base-url: ${CORE_MOCK_URL:http://localhost:8082}
    api-key: ${CORE_MOCK_KEY:dev-core-key-meridian-2026}
    token-secret: ${CORE_TOKEN_SECRET:dev-core-token-secret-meridian-2026-shared}
  screening:
    job-enabled: ${SCREENING_JOB_ENABLED:true}
    queue-delay: PT30S
  jobs:
    document-expiry-cron: "0 0 2 * * *"
    abandonment-cron: "0 30 2 * * *"
    rekyc-due-cron: "0 15 2 * * *"
    housekeeping-cron: "0 0 3 * * *"
  seed:
    enabled: ${SEED_ENABLED:true}
    screening-delay-for-seeded-submitted: PT2H
  provisioning:
    message: '{"email":"ops.lead@meridian.internal","name":"Operations Lead","role":"BANK_ADMIN","employeeId":"OPS-900"}'
  webhook:
    delivery-timeout-ms: 4000
