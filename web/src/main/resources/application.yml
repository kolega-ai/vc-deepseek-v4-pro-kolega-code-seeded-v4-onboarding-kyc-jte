spring:
  application:
    name: web
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: false

gg.jte:
  usePrecompiledTemplates: true
  templateSuffix: .jte

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  api-base-url: ${ONB_API_URL:http://localhost:9081}
  session-token-attribute: authToken
  session-role-attribute: authRole
